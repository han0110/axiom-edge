# Axiom Edge Docker Compose: 1 manager + N GPU service workers

x-edge-worker-template: &edge-worker-template
  image: axiom-edge-gpu
  cap_add:
    - SYS_NICE
  shm_size: '2gb'
  networks:
    - edge_net
  volumes:
    - ${ARTIFACTS_PATH:-/tmp/edge-test-artifacts}:/data/artifacts:ro
  profiles:
    - gpu

services:
  # Build-only service that produces the axiom-edge-gpu image
  edge-build:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-32}
        PROFILE: ${PROFILE:-release}
        CUDA_ARCH: ${CUDA_ARCH:?set CUDA_ARCH or use scripts/dev/start-provers.py}
        TARGET_CPU: ${TARGET_CPU:-native}
        BUILDER_IMAGE: ${BUILDER_IMAGE:-nvidia/cuda:13.1.0-devel-ubuntu24.04}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-nvidia/cuda:13.1.0-runtime-ubuntu24.04}
        FEATURES: ${FEATURES:-cuda,jemalloc,parallel,aot,unprotected}
        TOOLCHAIN_VERSION: ${TOOLCHAIN_VERSION:-+nightly-2025-08-19}
        VCS_REF: ${VCS_REF:-unknown}
        OPENVM_REV: ${OPENVM_REV:-unknown}
        STARK_BACKEND_REV: ${STARK_BACKEND_REV:-unknown}
        JEMALLOC_SYS_WITH_MALLOC_CONF: ${JEMALLOC_SYS_WITH_MALLOC_CONF:-retain:true,background_thread:true,metadata_thp:always,dirty_decay_ms:10000,muzzy_decay_ms:10000,abort_conf:true}
    image: axiom-edge-gpu
    command: ["/bin/true"]
    profiles:
      - gpu

  edge-manager:
    image: axiom-edge-gpu
    depends_on:
      edge-build:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=1
      # Deployment program loadout. Set by start-provers from EDGE_PROGRAMS
      # or from --programs JSON. An empty value starts the manager with an
      # empty loadout, which /register_program fills at runtime. Workers read
      # the same env value.
      - EDGE_PROGRAMS=${EDGE_PROGRAMS:-}
    # So edge-manager can reach an OTLP/HTTP metrics collector running on the
    # host. Inside the container, host.docker.internal resolves to the host
    # gateway, which matches the default endpoint in
    # config/templates/manager.toml.j2. Metrics export is best-effort: if no
    # collector is listening on the host's :4318, the manager drops metrics
    # silently and proving is unaffected.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["edge-manager", "--config", "/app/config/testing/docker-manager.toml"]
    networks:
      - edge_net
    volumes:
      - ${ARTIFACTS_PATH:-/tmp/edge-test-artifacts}:/data/artifacts:ro
      - ${METRICS_OUTPUT_PATH:-../metrics-output}:/data/metrics
    profiles:
      - gpu

  # GPU worker services are generated by scripts/dev/start-provers.py into docker/docker-compose.provers.yml.
  # See: scripts/dev/start-provers.py --help
  #
  # Metrics: the manager exports OTLP/HTTP to its configured metrics.endpoint
  # (host's :4318 by default). Run any OTLP collector there to collect them;
  # export is best-effort and proving is unaffected if none is listening.

networks:
  edge_net:
    driver: bridge

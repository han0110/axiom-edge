[package]
name = "edge-manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true
description = "Axiom Edge manager: orchestrates proof scheduling and aggregation across workers"

[[bin]]
name = "edge-manager"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = []
# Enable mock provers for testing
mock-provers = ["proof/mock-provers"]

[dependencies]
# Internal crates
protocol = { workspace = true }
proof = { workspace = true, default-features = false }
telemetry = { workspace = true }

# Web framework
async-stream = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }

# Serialization
bincode = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = { workspace = true }
eyre = { workspace = true }
color-eyre = { workspace = true }
zstd = { workspace = true }
base64 = { workspace = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }

# Concurrency
dashmap = { workspace = true }
crossbeam = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# OpenVM verification / proof encoding
openvm-stark-backend = { workspace = true }
verify-stark = { workspace = true }

# Telemetry
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }

# Derive utilities
serde_with = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

openvm-algebra-moduli-macros = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-algebra-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-bigint-circuit = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-bigint-guest = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-bigint-transpiler = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-build = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-circuit = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-circuit-derive = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-circuit-primitives = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }

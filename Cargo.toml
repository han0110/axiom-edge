openvm-continuations = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-custom-insn = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
openvm-deferral-circuit = { git = "https://github.com/han0110/openvm.git", branch = "patch/distributed/v2.0.0" }
